name: codweft-runner

on:
  workflow_call:
    inputs:
      codweft_job_id:
        description: "Codweft execution job id"
        required: true
        type: string
      codweft_bootstrap_nonce:
        description: "One-time Codweft runner bootstrap nonce"
        required: true
        type: string
      codweft_command_id:
        description: "Codweft command correlation id"
        required: true
        type: string
      command:
        description: "Command to run"
        required: true
        type: string
      issue_number:
        description: "Target issue number when applicable"
        required: false
        type: string
        default: ""
      pr_number:
        description: "Target pull request number when applicable"
        required: false
        type: string
        default: ""
      instruction:
        description: "Original Codweft instruction"
        required: false
        type: string
        default: ""
      source_url:
        description: "GitHub source URL that triggered the command"
        required: false
        type: string
        default: ""
      codweft_api_origin:
        description: "Codweft API origin"
        required: false
        type: string
        default: "https://codweft.com"
      runner_package:
        description: "HTTPS URL for the pinned Codweft runner tarball"
        required: true
        type: string
      runner_package_sha256:
        description: "SHA-256 digest for the Codweft runner tarball"
        required: true
        type: string
jobs:
  codweft:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      CODWEFT_API_URL: ${{ inputs.codweft_api_origin }}
      CODWEFT_JOB_ID: ${{ inputs.codweft_job_id }}
      CODWEFT_COMMAND_ID: ${{ inputs.codweft_command_id }}
      CODWEFT_BOOTSTRAP_NONCE: ${{ inputs.codweft_bootstrap_nonce }}
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Request Codweft runner bootstrap token
        id: bootstrap
        env:
          CODWEFT_REPOSITORY: ${{ github.repository }}
          CODWEFT_REPOSITORY_ID: ${{ github.repository_id }}
          CODWEFT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "GitHub Actions OIDC is unavailable. Ensure id-token: write is granted." >&2
            exit 1
          fi
          oidc_token=$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=codweft" | jq -r '.value')
          body_file=$(mktemp)
          jq -n \
            --arg jobId "$CODWEFT_JOB_ID" \
            --arg commandId "$CODWEFT_COMMAND_ID" \
            --arg bootstrapNonce "$CODWEFT_BOOTSTRAP_NONCE" \
            --arg repository "$CODWEFT_REPOSITORY" \
            --argjson repositoryId "$CODWEFT_REPOSITORY_ID" \
            --arg runId "$CODWEFT_RUN_ID" \
            '{jobId:$jobId, commandId:$commandId, bootstrapNonce:$bootstrapNonce, repository:$repository, repositoryId:$repositoryId, runId:$runId}' \
            > "$body_file"
          bootstrap_token=$(curl -fsSL \
            -X POST "${CODWEFT_API_URL%/}/api/runner/bootstrap" \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "Content-Type: application/json" \
            --data-binary "@${body_file}" | jq -r '.bootstrapToken')
          if [ -z "$bootstrap_token" ] || [ "$bootstrap_token" = "null" ]; then
            echo "Codweft did not return a bootstrap token." >&2
            exit 1
          fi
          echo "::add-mask::$bootstrap_token"
          {
            echo "token<<EOF"
            printf '%s\n' "$bootstrap_token"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Codweft runner
        env:
          CODWEFT_BOOTSTRAP_TOKEN: ${{ steps.bootstrap.outputs.token }}
        run: |
          set -euo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL
          runner_dir=$(mktemp -d)
          trap 'rm -rf "$runner_dir"' EXIT
          runner_tarball="$runner_dir/codweft-runner.tgz"
          runner_package="${{ inputs.runner_package }}"
          runner_sha256="${{ inputs.runner_package_sha256 }}"
          case "$runner_package" in
            https://*) ;;
            *) echo "runner_package must use HTTPS" >&2; exit 1 ;;
          esac
          if ! [[ "$runner_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "runner_package_sha256 must be a lowercase SHA-256 digest" >&2
            exit 1
          fi
          curl --proto '=https' --tlsv1.2 -fsSLo "$runner_tarball" "$runner_package"
          printf '%s  %s\n' "$runner_sha256" "$runner_tarball" | sha256sum --check --strict
          pushd "$runner_dir" >/dev/null
          bun init -y >/dev/null
          bun add "$runner_tarball"
          node node_modules/@codweft/runner/dist/index.js
          popd >/dev/null
